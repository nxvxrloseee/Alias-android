name: alias_game
description: "Элиас — игра в объяснение слов для одного телефона."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/words/
    - assets/sounds/
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: Golos
      fonts:
        - asset: assets/fonts/GolosText.ttf
